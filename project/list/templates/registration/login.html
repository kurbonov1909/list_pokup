{% extends 'list/base.html' %}

{% block content %}
<style>
    .login-container {
        /* min-height: 100vh; */
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    
    .login-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        max-width: 420px;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.18);
    }
    
    .login-header {
        text-align: center;
        margin-bottom: 32px;
    }
    
    .login-title {
        font-size: 28px;
        font-weight: 700;
        color: #1a202c;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
    }
    
    .login-subtitle {
        color: #64748b;
        font-size: 14px;
        font-weight: 400;
    }
    
    .form-group {
        margin-bottom: 24px;
    }
    
    .form-label {
        display: block;
        font-weight: 600;
        color: #374151;
        margin-bottom: 8px;
        font-size: 14px;
    }
    
    .form-control {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #e5e7eb;
        border-radius: 12px;
        font-size: 15px;
        background: #ffffff;
        font-family: inherit;
        box-sizing: border-box;
    }
    
    .form-control:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    .btn-login {
        width: 100%;
        padding: 14px 24px;
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 8px;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    
    .btn-login:hover {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    }
    
    .error-message {
        background: linear-gradient(135deg, #fee2e2, #fecaca);
        border: 1px solid #fca5a5;
        color: #b91c1c;
        padding: 16px;
        border-radius: 12px;
        margin-bottom: 24px;
        font-size: 14px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 12px;
    }
    
    .error-icon {
        font-size: 20px;
    }
    
    @media (max-width: 480px) {
        .login-container {
            padding: 16px;
        }
        
        .login-card {
            padding: 32px 24px;
        }
        
        .login-title {
            font-size: 24px;
        }
    }
</style>

<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h1 class="login-title">
                <span>🔐</span>
                Hisobot Tizimi
            </h1>
            <p class="login-subtitle">Tizimga kirish uchun login va parolni kiriting</p>
        </div>
        
        {% if form.errors %}
        <div class="error-message">
            <span class="error-icon">⚠️</span>
            <div>
                <strong>Xatolik:</strong> Login yoki parol noto'g'ri.
                <br>Iltimos, qayta urinib ko'ring.
            </div>
        </div>
        {% endif %}
        
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_username" class="form-label">
                    Foydalanuvchi nomi
                </label>
                <input type="text" 
                       class="form-control" 
                       name="username" 
                       id="id_username" 
                       placeholder="Login kiriting..."
                       required>
            </div>

            <div class="form-group">
                <label for="id_password" class="form-label">
                    Parol
                </label>
                <input type="password" 
                       class="form-control" 
                       name="password" 
                       id="id_password" 
                       placeholder="Parolni kiriting..."
                       required>
            </div>

            <button type="submit" class="btn-login">
                Tizimga kirish
            </button>
        </form>
    </div>
</div>
{% endblock %}
